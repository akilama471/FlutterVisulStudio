[package]
name = "flutter-ui-studio"
version = "0.1.0"
description = "A visual desktop studio for building Flutter user interfaces"
authors = ["Akila Madushanka"]
license = "GPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "flutter_ui_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }

[profile.dev]
incremental = true
